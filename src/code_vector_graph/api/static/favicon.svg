<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Code Vector Graph">
  <title>Code Vector Graph</title>
  <!-- The page-frame motif from Design.md, at 32px: black frame, white canvas,
       one olive ribbon block. Palette-closed. -->
