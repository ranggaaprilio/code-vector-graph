  <rect x="3" y="3" width="26" height="26" fill="#ffffff"/>
  <rect x="6" y="7" width="20" height="6" fill="#8e8a25"/>
  <rect x="6" y="17" width="20" height="2" fill="#000000"/>
  <rect x="6" y="22" width="13" height="2" fill="#000000"/>
</svg>
