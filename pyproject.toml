[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-vector-graph"
version = "0.1.0"
description = "Turn JS/TS repositories into a searchable knowledge graph: vector embeddings (Qdrant) + code ontology (Neo4j), exposed over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

# Base install = parse a repo and talk to the stores. The heavy or
# optional-by-role pieces live in the extras below.
dependencies = [
    "tree-sitter>=0.22",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
    "qdrant-client>=1.9",
    "neo4j>=5.0",
    "tokenizers>=0.19",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Local embedding generation (multi-GB wheels — only needed to index or query).
ingest = ["torch>=2.7.1", "transformers>=4.53.0", "huggingface_hub>=0.23"]
# Web dashboard. Pulls in `mcp` because api/mcp_client.py imports it at module
# top and the dashboard spawns the MCP server for search/chat.
serve = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sse-starlette>=2.0",
    "anthropic>=0.39",
    "openai>=1.30",
    "code-vector-graph[mcp]",
]
# RAG answers in the query CLI, and OKF wiki enrichment (DeepSeek is OpenAI-compatible).
query = ["openai>=1.30"]
# MCP server.
mcp = ["mcp[cli]>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
all = [
    "code-vector-graph[ingest,serve,query,mcp,dev]",
]

[project.scripts]
cvg-ingest         = "code_vector_graph.cli.ingest:main"
cvg-query          = "code_vector_graph.cli.query:main"
cvg-mcp            = "code_vector_graph.mcp_server.server:main"
cvg-serve          = "code_vector_graph.cli.serve:main"
cvg-download-model = "code_vector_graph.cli.download_model:main"
cvg-okf-build      = "code_vector_graph.cli.okf_build:main"
cvg-okf-sync       = "code_vector_graph.cli.okf_sync:main"
cvg-reinit-graph   = "code_vector_graph.cli.reinit_graph:main"
cvg-backfill-repo  = "code_vector_graph.cli.backfill_repo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The dashboard SPA is served straight out of the package.
"code_vector_graph.api" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/manual/ is excluded via collect_ignore_glob in tests/conftest.py so the
# exclusion holds no matter which directory pytest is invoked from.
